[project]
name = "lemonade"
version = "0.1.0"
description = "Lemonade Stand Tycoon — a terminal business simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "rich>=13",
]

[project.scripts]
lemonade = "lemonade.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # never reformat code samples in docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/property"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["lemonade", "factories", "strategies"]
